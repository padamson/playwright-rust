# Standalone (excluded from the root workspace): this is a wasm32 Leptos CSR
# crate built by Trunk, not part of the publishable-crate workspace. Keeping it
# out of `members` leaves `cargo build/clippy/nextest --workspace` and the
# supply-chain (security.yml) graph for the shipped crates untouched.
[package]
name = "playwright-rs-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
authors = ["Paul Adamson"]
repository = "https://github.com/padamson/playwright-rust"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Fetch /versions.json at runtime so a deployed snapshot can list versions
# released after it was built (the version dropdown). `http` only.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
# Deserialize the versions manifest.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
# Register the page's WebMCP tools for agents (`src/agent_tools.rs`): the
# browser API is too new for typed bindings, so it is reached through js-sys.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlSelectElement", "Navigator", "Node", "NodeList", "Window", "console"] }

# Build-time only: highlight code snippets to HTML so nothing is shipped to the
# WASM bundle. `default-fancy` swaps the C oniguruma regex for pure-Rust
# fancy-regex.
[build-dependencies]
syntect = { version = "5.2", default-features = false, features = [
    "default-fancy",
] }
