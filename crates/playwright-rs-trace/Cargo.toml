[package]
name = "playwright-rs-trace"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Parser for Playwright trace zip files (formats v8 and v9)"
keywords = ["playwright", "trace", "parser", "viewer"]
categories = ["development-tools::testing", "parser-implementations"]
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Playwright trace zips use deflate exclusively. Disable other
# compression backends to keep the dep tree small (and to avoid
# pulling in C-FFI compressors that complicate the eventual WASM
# build planned in slice 6).
# The flate2 backend alone decodes deflate; zip's `deflate` feature would
# also pull zopfli, an encoder a read-only parser never calls.
zip = { version = "8", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
