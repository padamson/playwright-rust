[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# xtask is `publish = false`, so the version constraint is purely
# bookkeeping for cargo-deny — the path resolution wins.
playwright-rs = { path = "../playwright", version = "0.18.0" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
serde_json = { workspace = true }
# Fetches the pinned driver's protocol spec. Already in the graph through
# playwright-rs's `cli` feature, so no new audit surface.
ureq = { version = "3", default-features = false, features = [
    "rustls",
    "gzip",
    "rustls-webpki-roots",
] }
# Digests the vendored spec files so the offline check can see an edited or
# truncated tree. Already in the graph through axum, so no new audit surface.
# Drift detection, not a security boundary.
sha1 = "0.10"
