version: 2
updates:
  # Maintain Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Wait before opening a PR for a freshly published version. Without this,
    # bumps arrive the moment a crate publishes — necessarily before any of the
    # cargo-vet import sets (Mozilla, Google, ISRG, ...) has audited it, so
    # `cargo vet` fails on the PR by construction and gets waved through with an
    # exemption. A cooldown lets those audits land first (most bumps then vet
    # clean with no exemption at all) and lets yanks/advisories surface before
    # we adopt a release. Longer for majors, which are the riskiest and least
    # urgent.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Workaround, not policy — remove once the updater handles this. Every
    # scheduled cargo run has aborted since 2026-07-18 with
    # `Failed to update serde!` from the lockfile updater's
    # validate_dependency_update, which takes down the whole run: no cargo
    # dependency updates at all, security ones included. serde pins
    # `serde_core =<same version>` exactly, so it cannot move on its own, which
    # a single-dependency update appears unable to satisfy. Scoped to the one
    # version that trips it, so later serde releases stay eligible. Tracked in
    # issue #131; `cargo audit` still covers serde advisories meanwhile.
    ignore:
      - dependency-name: "serde"
        versions: ["1.0.229"]
    # Grouping keeps the weekly run to as few PRs as possible. Every cargo PR
    # edits Cargo.lock, so two open cargo PRs conflict the moment one merges
    # and the second must rebase and re-run CI; with N PRs the auto-merge
    # cascade costs O(N^2) runs. Fewer PRs is the only fix.
    groups:
      start-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        patterns:
          - "*"
        update-types:
          - "major"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    # Only `default-days` here: Dependabot's schema rejects the per-semver keys
    # for github-actions (actions are not semver-versioned the way crates are),
    # and one unsupported key invalidates the whole file, including the cargo
    # block above. Value is a plain wait for a tag to prove itself, since the
    # cargo-vet lag argument does not apply to actions.
    cooldown:
      default-days: 7
    # One PR for the week's action bumps, same cascade rationale as cargo.
    groups:
      actions:
        patterns:
          - "*"
