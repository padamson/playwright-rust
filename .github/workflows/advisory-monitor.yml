name: Security Advisory Monitor

# Daily run of the deny job's advisory check, so an advisory published
# between pushes becomes a tracking issue before it turns a gate red.

on:
  schedule:
    # Daily at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

# One run at a time: two overlapping runs would each see no open issue
# and each open one.
concurrency:
  group: advisory-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advisories:
    name: Check for new advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open, update and close the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
          fallback: none

      # Triage goes in comments: the action rewrites the body each run.
      - name: Check advisories and keep the tracking issue current
        uses: padamson/cargo-lockpatrol@e791845e4a03af540c2348755c3695041cdd54fd # v0.2.0
        # Pinned so a change to the action's defaults still finds the issue.
        with:
          issue: "true"
          issue-title: "Security: new dependency advisory detected"
          issue-label: security-advisory
