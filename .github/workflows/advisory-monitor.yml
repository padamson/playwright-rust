name: Security Advisory Monitor

# Daily run of the Security Audit gate's check, so an advisory published
# between pushes becomes a tracking issue before it turns a gate red.

on:
  schedule:
    # Daily at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

# One run at a time: two overlapping runs would each see no open issue
# and each open one.
concurrency:
  group: advisory-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  advisories:
    name: Check for new advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open, update and close the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny

      # Triage goes in comments: the action rewrites the body each run.
      - name: Check advisories and keep the tracking issue current
        uses: padamson/cargo-lockpatrol@40075b2231e33e8f0a6d08f39acd0691e1f3efba # v0.1.1
        # Pinned so a change to the action's defaults still finds the issue.
        with:
          issue: "true"
          issue-title: "Security: new dependency advisory detected"
          issue-label: security-advisory
