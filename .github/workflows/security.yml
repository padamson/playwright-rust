name: Security & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly Saturday 5am ET — catches new advisories and test quality drift
    - cron: '0 9 * * 6'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run cargo audit
      run: cargo audit

  deny:
    name: License & Dependency Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deny
      run: cargo install cargo-deny

    - name: Run cargo deny
      run: cargo deny check

  supply-chain:
    name: Supply Chain Review
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-vet
      run: cargo install cargo-vet

    - name: Run cargo vet
      run: cargo vet

  # Semver compatibility is checked in release.yml, where it can gate the
  # publish. This workflow never triggers on tag pushes, so a tag-gated job
  # here would silently never run.

  mutation-testing:
    name: Mutation Testing (full)
    runs-on: ubuntu-latest
    # Full-codebase run is too slow for every push; per-PR coverage is
    # handled by mutation-testing-diff. This workflow does not trigger on
    # tag pushes (`on.push` filters to branches), so release tags are not
    # a trigger here — dispatch manually if a run is wanted before a tag.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    # mutants runs lib + serialization tests only (no browser) so skip the
    # 42 MB driver download, and re-enable incremental (off globally) since
    # cargo-mutants rebuilds once per mutant and benefits from it.
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
      CARGO_INCREMENTAL: "1"

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: mutants

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    # Prebuilt binary — `cargo install` fails when a cache restore
    # leaves an existing binary in ~/.cargo/bin/.
    - name: Install cargo-mutants
      uses: taiki-e/install-action@v2.85.6
      with:
        tool: cargo-mutants

    - name: Run mutation testing
      run: cargo mutants

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mutation-report
        path: mutants.out/

  fuzz-smoke:
    name: Fuzz smoke (protocol parsers)
    runs-on: ubuntu-latest
    # Short fixed-budget runs of the cargo-fuzz targets (evaluate-conversion
    # parsers). Weekly + on demand: too slow for every push, and cargo-fuzz
    # needs nightly.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-fuzz
      uses: taiki-e/install-action@v2.85.6
      with:
        tool: cargo-fuzz

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: crates/playwright/fuzz

    - name: Run fuzz targets (60s each)
      working-directory: crates/playwright
      run: |
        # Pin the glibc target: cargo-fuzz otherwise defaults to musl,
        # whose statically linked libc is incompatible with AddressSanitizer.
        for target in fuzz_parse_value fuzz_parse_result fuzz_serialize_argument; do
          cargo +nightly fuzz run "$target" \
            --target x86_64-unknown-linux-gnu -- -max_total_time=60 -timeout=10
        done

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: fuzz-artifacts
        path: crates/playwright/fuzz/artifacts/

  mutation-testing-diff:
    name: Mutation Testing (diff)
    runs-on: ubuntu-latest
    # Per-push variant via `cargo mutants --in-diff`.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    # See the full job above — same rationale.
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
      CARGO_INCREMENTAL: "1"

    steps:
    - uses: actions/checkout@v7
      with:
        # Need history beyond HEAD so `git diff` can reach the diff base.
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: mutants-diff

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Install cargo-mutants
      uses: taiki-e/install-action@v2.85.6
      with:
        tool: cargo-mutants

    # PR: merge base against target branch.
    # Push: parent of HEAD (`before` SHA), when git can actually reach it.
    # Two cases where it can't, both of which must fall back to HEAD~1
    # rather than fail the job: the first push to a branch reports
    # before = 000...0, and a force-push reports the commit it just
    # replaced, which no longer exists on the remote (so `fetch-depth: 0`
    # does not bring it in either). Probing reachability covers both.
    - name: Compute diff base
      id: base
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
        elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
          echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
        else
          echo "unreachable base ${{ github.event.before }}; mutating HEAD alone"
          echo "ref=HEAD~1" >> $GITHUB_OUTPUT
        fi

    - name: Run mutation testing on diff
      run: ./scripts/mutants.sh ${{ steps.base.outputs.ref }}

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: mutation-report-diff
        path: mutants.out/
