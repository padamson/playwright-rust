name: Security & Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly Saturday 5am ET — catches new advisories and test quality drift
    - cron: '0 9 * * 6'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Not in install-action's manifest, so nothing updates it but a hand edit.
  CARGO_FUZZ_VERSION: "0.13.2"

permissions:
  contents: read

jobs:
  # The main ruleset and scripts/require-supply-chain-checks.sh require
  # this job by name.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Install cargo-deny
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-deny
        fallback: none

    - name: Check advisories in every lockfile
      uses: padamson/cargo-lockpatrol@40075b2231e33e8f0a6d08f39acd0691e1f3efba # v0.1.1

  deny:
    name: License & Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Install cargo-deny
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-deny
        fallback: none

    - name: Run cargo deny
      run: scripts/deny-lockfiles.sh

  supply-chain:
    name: Supply Chain Review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    # Built from crates.io on purpose: install-action serves GitHub release
    # binaries, and cargo-vet's newest release with binaries is 0.10.0, which
    # cannot parse the audits file that 0.10.2 (crates.io) writes. No cache
    # step here, so the restored-binary failure `cargo install` has elsewhere
    # does not apply. `--locked` builds against cargo-vet's own Cargo.lock.
    # No version pin on purpose: Dependabot cannot bump a `run:` line, and
    # cargo-vet refuses a store written by a newer version, so a pinned CI
    # copy older than a contributor's local one goes red.
    - name: Install cargo-vet
      run: cargo install cargo-vet --locked

    - name: Run cargo vet
      run: cargo vet

  # The semver gate is the job in release.yml, which blocks the publish. This
  # one runs the same check on every PR and push to main, so a break shows
  # up before the release commit and its tag are public. It is deliberately
  # not a required check: between releases Cargo.toml still carries the last
  # released version, so red means the next release needs a bigger bump than
  # planned, not that the change is wrong. playwright-rs-macros is left out
  # because a proc-macro crate has no library API to compare.
  semver-preview:
    name: Semver preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # rustdoc never runs the driver, so skip its download.
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    # Both the current tree and the crates.io baseline are built for rustdoc
    # on every run; the cache carries both under target/.
    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: semver-preview

    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-semver-checks
        fallback: none

    - name: Check semver against the last release
      run: cargo semver-checks check-release -p playwright-rs -p playwright-rs-trace

  mutation-testing:
    name: Mutation Testing (full)
    runs-on: ubuntu-latest
    # GitHub's ceiling for a hosted job. The sweep took 322 minutes on
    # 2026-11-07, so it needs sharding before it grows much more.
    timeout-minutes: 360
    # Full-codebase run is too slow for every push; per-PR coverage is
    # handled by mutation-testing-diff. This workflow does not trigger on
    # tag pushes (`on.push` filters to branches), so release tags are not
    # a trigger here — dispatch manually if a run is wanted before a tag.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    # Re-enable incremental (off globally): cargo-mutants rebuilds once per
    # mutant and benefits from it. The driver download is skipped in
    # .cargo/mutants.toml.
    env:
      CARGO_INCREMENTAL: "1"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: mutants

    - name: Install cargo-nextest
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-nextest
        fallback: none

    # Prebuilt binary — `cargo install` fails when a cache restore
    # leaves an existing binary in ~/.cargo/bin/.
    - name: Install cargo-mutants
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-mutants
        fallback: none

    - name: Run mutation testing
      run: cargo mutants

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: mutation-report
        path: mutants.out/

  fuzz-smoke:
    name: Fuzz smoke (protocol parsers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Short fixed-budget runs of the cargo-fuzz targets (evaluate-conversion
    # parsers). Weekly + on demand: too slow for every push, and cargo-fuzz
    # needs nightly.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: nightly

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: crates/playwright/fuzz

    # Not on install-action: its manifest has no cargo-fuzz. After
    # rust-cache with --force, so an older copy it restores into
    # ~/.cargo/bin cannot stand in for the pinned one. Stable builds the
    # tool; only the fuzz targets need nightly.
    - name: Install cargo-fuzz
      run: cargo +stable install --locked --force cargo-fuzz --version "$CARGO_FUZZ_VERSION"

    # Carry the corpus between runs. rust-cache covers ~/.cargo and the build
    # directory but not corpus/, so without this every weekly run restarts
    # from the committed seeds and the 60s budget buys the same shallow
    # coverage forever. The rolling key means each run restores the newest
    # prior corpus and saves the grown one under a fresh key.
    - name: Restore fuzz corpus
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: crates/playwright/fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: fuzz-corpus-

    - name: Run fuzz targets (60s each)
      working-directory: crates/playwright
      run: |
        # Derive the target list rather than hardcoding it, so a target added
        # to fuzz/Cargo.toml runs here without a workflow edit. A hardcoded
        # list fails silently: the new target just never gets fuzzed.
        #
        # Assert the list is non-empty before looping. `for x in $(cmd)` runs
        # zero iterations and exits 0 when the substitution fails or comes
        # back empty, and errexit does not apply to a for word list — so the
        # discovery step would itself become the silent failure it replaced.
        targets=$(cargo +nightly fuzz list)
        if [ -z "$targets" ]; then
          echo "::error::cargo fuzz list returned no targets"
          exit 1
        fi
        echo "fuzzing: $(echo "$targets" | tr '\n' ' ')"

        for target in $targets; do
          # Seed from the committed corpus. The cache below carries the grown
          # corpus between runs, but a cache miss must not silently mean a
          # cold start with a 60s budget: most random bytes fail the JSON
          # parse and never reach the code under test.
          if [ -d "fuzz/seeds/$target" ]; then
            mkdir -p "fuzz/corpus/$target"
            cp -n "fuzz/seeds/$target"/* "fuzz/corpus/$target/" 2>/dev/null || true
          fi

          # Pin the glibc target: cargo-fuzz otherwise defaults to musl,
          # whose statically linked libc is incompatible with AddressSanitizer.
          cargo +nightly fuzz run "$target" \
            --target x86_64-unknown-linux-gnu -- -max_total_time=60 -timeout=10
        done

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: fuzz-artifacts
        path: crates/playwright/fuzz/artifacts/

  mutation-testing-diff:
    name: Mutation Testing (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Per-push variant via `cargo mutants --in-diff`.
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    # See the full job above — same rationale.
    env:
      CARGO_INCREMENTAL: "1"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Need history beyond HEAD so `git diff` can reach the diff base.
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: mutants-diff

    - name: Install cargo-nextest
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-nextest
        fallback: none

    - name: Install cargo-mutants
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-mutants
        fallback: none

    # PR: merge base against target branch.
    # Push: parent of HEAD (`before` SHA), when git can actually reach it.
    # Two cases where it can't, both of which must fall back to HEAD~1
    # rather than fail the job: the first push to a branch reports
    # before = 000...0, and a force-push reports the commit it just
    # replaced, which no longer exists on the remote (so `fetch-depth: 0`
    # does not bring it in either). Probing reachability covers both.
    - name: Compute diff base
      id: base
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
        elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
          echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
        else
          echo "unreachable base ${{ github.event.before }}; mutating HEAD alone"
          echo "ref=HEAD~1" >> $GITHUB_OUTPUT
        fi

    # The hook of the same name is per-clone; a hookless clone would
    # otherwise land a test binary that the mutation runs never execute.
    - name: Check the mutation kill set names every test binary
      run: ./scripts/check-mutants-test-targets.sh

    - name: Run mutation testing on diff
      run: ./scripts/mutants.sh ${{ steps.base.outputs.ref }}

    - name: Upload mutation report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: mutation-report-diff
        path: mutants.out/

  cli-install:
    name: CLI installer (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `cli_bin` tests are `#[ignore]`d because each one downloads a
    # driver from the CDN, and they sit behind the non-default `cli`
    # feature. The push gate enables the feature but does not run ignored
    # tests; the stress step runs ignored tests but not the feature. So
    # neither ran them, ever — including through 0.19.0, which moved the
    # driver into the user cache these tests are about. Weekly is enough
    # for an installer path that changes about once a release, and keeps a
    # fresh ~100 MB download off every push.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: stable

    - name: Cache Cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: cli-install

    - name: Install cargo-nextest
      uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
      with:
        tool: cargo-nextest
        fallback: none

    # No driver cache and no PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: downloading
    # into a bare HOME is the thing under test.
    - name: Run the CLI installer tests
      shell: bash
      run: |
        set -o pipefail
        cargo nextest run -p playwright-rs --features cli --profile ci \
          --run-ignored ignored-only -E 'binary(integration) and test(cli_bin)' \
          2>&1 | tee nextest-main.log

    - name: Report flaky tests
      if: always() && hashFiles('nextest-main.log') != ''
      shell: bash
      env:
        FLAKY_REPORT_LABEL: the weekly CLI installer job
      run: scripts/report-flaky-tests.sh nextest-main.log
