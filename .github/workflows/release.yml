name: Release

# A tag pattern added here also goes into the `release tags` ruleset and
# the `release` environment's deployment policies.
on:
  push:
    tags:
      # Per-crate tag prefixes — the create-release and publish-crates
      # jobs route to the right CHANGELOG / cargo package based on the
      # prefix. See `crates/<crate>/CHANGELOG.md` for each crate's
      # release notes; the top-level CHANGELOG.md is an index.
      - 'v*'           # playwright-rs
      - 'macros-v*'    # playwright-rs-macros
      - 'trace-v*'     # playwright-rs-trace

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Browser builds are per OS release (WebKit links its ICU), so the cache
      # key names the runner image.
      - name: Name the runner image
        id: image
        shell: bash
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      # The driver is assembled by build.rs into the user cache beside the
      # browsers, so one cache entry holds both.
      - name: Cache Playwright driver and browsers (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-rust
            ~/Library/Caches/ms-playwright
            ~/Library/Caches/playwright-rust
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.0-v5
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.0-v5

      - name: Cache Playwright driver and browsers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\ms-playwright
            ~\AppData\Local\playwright-rust
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.0-v5
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.0-v5

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      - name: Build
        run: cargo build --verbose

      - name: Quiesce host package manager (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: ./scripts/quiesce-apt.sh

      - name: Install Playwright browsers
        # Bounded because a contended apt blocks indefinitely rather than
        # failing; this stalled the 0.16.0 release twice with no output.
        timeout-minutes: 15
        run: cargo run --release --bin playwright-rs --features cli -- install chromium firefox webkit${{ runner.os == 'Linux' && ' --with-deps' || '' }}

      - name: Run tests
        # Same feature set as the push gate, so the run that precedes a
        # publish is not narrower than the one that guards main. Teed for
        # the flaky report below; `set -o pipefail` keeps a failing suite
        # failing, which matters more here than anywhere else.
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --all-features --profile ci --target ${{ matrix.target }} 2>&1 | tee nextest-main.log

      # A flake in the run that gates a publish is worth knowing about
      # before the tag goes out, not after.
      - name: Report flaky tests
        if: always() && hashFiles('nextest-main.log') != ''
        shell: bash
        env:
          FLAKY_REPORT_LABEL: ${{ matrix.target }}
        run: scripts/report-flaky-tests.sh nextest-main.log

  # vet, deny and audit run in security.yml on the push to main, which a tag
  # push does not trigger. Rather than run them a second time here, both
  # publishing jobs wait on this check that the tagged commit is on main and
  # that they passed on it, so a tag on a red or unmerged commit publishes
  # nothing. It waits for the test matrix, which outlasts Security &
  # Quality, so a tag pushed right after the commit is not refused for
  # being early.
  supply-chain-gates:
    name: Supply-chain gates passed
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A pull request's checks are reported on its head commit but test the
      # merge, and a dispatched run can test any branch, so passing checks
      # alone do not show that the commit is the one main tested. "behind"
      # or "identical" means main contains it.
      - name: Require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/compare/refs/heads/main...$SHA" --jq .status)
          case "$status" in
            behind|identical) echo "ok    $SHA is on main" ;;
            *) echo "::error::$SHA is not on main ($status). Tag a commit that main's CI has tested."; exit 1 ;;
          esac

      - name: Require vet, deny and audit to have passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" > check-runs.json
          scripts/require-supply-chain-checks.sh check-runs.json

  create-release:
    name: Create GitHub Release
    needs: [test, semver-checks, supply-chain-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Resolve which crate this release tag is for, which CHANGELOG to
      # extract notes from, and the bare version string. Three tag
      # patterns are recognised — see the `on.push.tags` block above.
      - name: Resolve crate, changelog, and version from tag
        id: resolve
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          case "$REF" in
            macros-v*)
              echo "crate=playwright-rs-macros" >> "$GITHUB_OUTPUT"
              echo "changelog=crates/playwright-rs-macros/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              echo "version=${REF#macros-v}" >> "$GITHUB_OUTPUT"
              ;;
            trace-v*)
              echo "crate=playwright-rs-trace" >> "$GITHUB_OUTPUT"
              echo "changelog=crates/playwright-rs-trace/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              echo "version=${REF#trace-v}" >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "crate=playwright-rs" >> "$GITHUB_OUTPUT"
              echo "changelog=crates/playwright/CHANGELOG.md" >> "$GITHUB_OUTPUT"
              echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown tag pattern: $REF" >&2
              exit 1
              ;;
          esac

      - name: Install parse-changelog
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: parse-changelog

      - name: Generate Release Notes
        run: parse-changelog ${{ steps.resolve.outputs.changelog }} ${{ steps.resolve.outputs.version }} > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.resolve.outputs.crate }} ${{ steps.resolve.outputs.version }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lives here rather than in security.yml because it has to *gate* the
  # release. security.yml only triggers on branch pushes and PRs, so the
  # tag-ref condition this job used to carry could never fire — it had
  # never run once. Even with tags added there it would run concurrently
  # with publishing, reporting breakage after the crate was already on
  # crates.io. As a `needs:` of create-release and publish-crates it
  # blocks both, so a bad bump leaves no GitHub Release behind either.
  # No `needs:` — the API comparison is independent of the test matrix, so
  # running them in parallel surfaces a bad bump in a couple of minutes
  # instead of after the full cross-platform run.
  semver-checks:
    name: Semver Compatibility
    runs-on: ubuntu-latest
    # rustdoc never runs the driver, so skip its download.
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-semver-checks

      # Compares the just-bumped local version against the last version
      # published to crates.io and fails if the bump is too small for the
      # API change. Routed per tag prefix so a trace release doesn't check
      # the main crate.
      - name: Check semver compatibility
        run: |
          case "${GITHUB_REF#refs/tags/}" in
            macros-v*)
              echo "playwright-rs-macros is a proc-macro crate with no library" \
                   "target, so there is no API surface to compare. Skipping."
              ;;
            trace-v*) cargo semver-checks check-release -p playwright-rs-trace ;;
            v*)       cargo semver-checks check-release -p playwright-rs ;;
            *)        echo "Unknown tag pattern: ${GITHUB_REF#refs/tags/}" >&2; exit 1 ;;
          esac

  publish-crates:
    name: Publish to crates.io
    needs: [test, semver-checks, supply-chain-gates]
    runs-on: ubuntu-latest
    # Only release tags can deploy here, and the crates.io publisher names
    # this environment, so a copy of this file run from a branch can't publish.
    environment: release
    # Scoped to this job, not the workflow: only publishing needs to mint an
    # OIDC token, and `id-token: write` is what lets a job request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Trusted publishing: exchange a GitHub OIDC token for a crates.io token
      # scoped to this repo, workflow and environment and valid for minutes,
      # instead of holding a long-lived CARGO_REGISTRY_TOKEN that works from
      # anywhere and never expires. The action's post step revokes it when
      # the job ends.
      #
      # This replaces a soft "skip if the secret is missing" guard. That guard
      # would now be actively harmful: with the secret gone it would skip every
      # publish and report success, turning a broken release into a silent
      # no-op. Failing here is the correct behavior — it means the trusted
      # publisher is not configured for the crate being released.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      # Each tag prefix publishes exactly one crate. Independent
      # versioning means a coordinated release pushes multiple tags
      # in dependency order:
      #
      #   1. macros-vX.Y.Z  (if macros bumped this cycle)
      #   2. trace-vX.Y.Z   (if trace bumped this cycle)
      #   3. vX.Y.Z         (always, for the main crate)
      #
      # Wait ~30s between tags so the crates.io index propagates before
      # the next publish runs. If neither macros nor trace bumped this
      # cycle, just push the `v*` tag — the existing published versions
      # already satisfy `playwright-rs`'s dep constraints.
      - name: Publish playwright-rs-macros
        if: startsWith(github.ref_name, 'macros-v')
        run: cargo publish -p playwright-rs-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish playwright-rs-trace
        if: startsWith(github.ref_name, 'trace-v')
        run: cargo publish -p playwright-rs-trace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish playwright-rs
        if: startsWith(github.ref_name, 'v')
        run: cargo publish -p playwright-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
