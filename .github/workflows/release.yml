name: Release

# A tag pattern added here also goes into the `release tags` ruleset and
# the `release` environment's deployment policies.
on:
  push:
    tags:
      # Per-crate tag prefixes, which release-refs routes to a crate and its
      # CHANGELOG. The top-level CHANGELOG.md is an index.
      - 'v*'           # playwright-rs
      - 'macros-v*'    # playwright-rs-macros
      - 'trace-v*'     # playwright-rs-trace

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # The hand-written version numbers, checked before the tests and the
  # semver check start. A mistake here fails the release in under a minute,
  # instead of after the tests have run on every platform. Also resolves
  # which crate the tag releases, the one routing table the later jobs read.
  release-refs:
    name: Release references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      crate: ${{ steps.resolve.outputs.crate }}
      changelog: ${{ steps.resolve.outputs.changelog }}
      version: ${{ steps.resolve.outputs.version }}
      has-lib: ${{ steps.resolve.outputs.has-lib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The runner's own cargo may lag the manifests; test.yml and the hook
      # run the same checks on stable.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # A tag whose crate is not at the tag's version is a release whose
      # Cargo.toml bump was forgotten. `cargo publish` would refuse it, but
      # create-release runs beside the publish and would still make the
      # GitHub Release, and semver-checks would compare the old version with
      # itself and pass. A CHANGELOG with no section for the version is the
      # mirror image: parse-changelog fails in create-release while the crate
      # publishes.
      - name: Resolve the tag and check its crate's version and CHANGELOG
        id: resolve
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            macros-v*) crate=playwright-rs-macros prefix=macros-v changelog=crates/playwright-rs-macros/CHANGELOG.md ;;
            trace-v*)  crate=playwright-rs-trace  prefix=trace-v  changelog=crates/playwright-rs-trace/CHANGELOG.md ;;
            v*)        crate=playwright-rs        prefix=v        changelog=crates/playwright/CHANGELOG.md ;;
            *) echo "::error::unknown tag pattern: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          version=${GITHUB_REF_NAME#"$prefix"}
          package=$(cargo metadata --no-deps --format-version 1 \
                      | jq -c --arg c "$crate" '.packages[] | select(.name == $c)')
          actual=$(jq -r .version <<< "$package")
          if [ "$actual" != "$version" ]; then
            echo "::error::$crate is at $actual, but the tag says $version; bump its Cargo.toml"
            exit 1
          fi
          if ! grep -qF "## [$version]" "$changelog"; then
            echo "::error::$changelog has no section for $version"
            exit 1
          fi
          # A proc-macro crate has no library API for semver-checks to compare.
          has_lib=$(jq '[.targets[].kind[]] | any(. == "lib" or . == "rlib")' <<< "$package")
          {
            echo "crate=$crate"
            echo "changelog=$changelog"
            echo "version=$version"
            echo "has-lib=$has_lib"
          } >> "$GITHUB_OUTPUT"

      # On every tag, not only the crate being released; also a commit-time
      # check, so this is the backstop.
      - name: Check each crate requires its siblings at their current versions
        run: scripts/check-sibling-reqs.sh

  test:
    name: Test ${{ matrix.target }}
    needs: [release-refs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Browser builds are per OS release (WebKit links its ICU), so the cache
      # key names the runner image.
      - name: Name the runner image
        id: image
        shell: bash
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      # The driver is assembled by build.rs into the user cache beside the
      # browsers, so one cache entry holds both.
      - name: Cache Playwright driver and browsers (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-rust
            ~/Library/Caches/ms-playwright
            ~/Library/Caches/playwright-rust
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.1-v5
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.1-v5

      - name: Cache Playwright driver and browsers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~\AppData\Local\ms-playwright
            ~\AppData\Local\playwright-rust
          key: ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.1-v5
          restore-keys: |
            ${{ runner.os }}-${{ steps.image.outputs.os }}-playwright-browsers-1.65.1-v5

      - name: Install cargo-nextest
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-nextest
          fallback: none

      - name: Build
        run: cargo build --verbose

      - name: Quiesce host package manager (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: ./scripts/quiesce-apt.sh

      - name: Install Playwright browsers
        # Bounded because a contended apt blocks indefinitely rather than
        # failing; this stalled the 0.16.0 release twice with no output.
        timeout-minutes: 15
        run: cargo run --release --bin playwright-rs --features cli -- install chromium firefox webkit${{ runner.os == 'Linux' && ' --with-deps' || '' }}

      - name: Run tests
        # Same feature set as the push gate, so the run that precedes a
        # publish is not narrower than the one that guards main. Teed for
        # the flaky report below; `set -o pipefail` keeps a failing suite
        # failing, which matters more here than anywhere else.
        shell: bash
        run: |
          set -o pipefail
          cargo nextest run --workspace --all-features --profile ci --target ${{ matrix.target }} 2>&1 | tee nextest-main.log

      # A flake in the run that gates a publish is worth knowing about
      # before the tag goes out, not after.
      - name: Report flaky tests
        if: always() && hashFiles('nextest-main.log') != ''
        shell: bash
        env:
          FLAKY_REPORT_LABEL: ${{ matrix.target }}
        run: scripts/report-flaky-tests.sh nextest-main.log

  # A pull request's checks are reported on its head commit but test the
  # merge, and a dispatched run can test any branch, so a tag is published
  # only from a commit main contains. "behind" or "identical" means it does.
  on-main:
    name: Tagged commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/compare/refs/heads/main...$SHA" --jq .status)
          case "$status" in
            behind|identical) echo "ok    $SHA is on main" ;;
            *) echo "::error::$SHA is not on main ($status). Tag a commit that main's CI has tested."; exit 1 ;;
          esac

  # cargo deny (with cargo-lockpatrol's advisories) and cargo vet on the
  # tagged commit, at the pin and with the excluded trees security.yml uses;
  # nothing publishes unless they pass. They read advisories and imported
  # audits when this job runs, so a re-run reads them again.
  supply-chain-gates:
    name: Supply-chain gates
    uses: padamson/rust-ci-workflows/.github/workflows/supply-chain.yml@07d9be408f21f565a66488d6931b1a39b3f872e0 # v0.2.0
    with:
      deny-manifests: |
        crates/site
        crates/site-e2e
        crates/playwright/fuzz

  create-release:
    name: Create GitHub Release
    needs: [release-refs, test, semver-checks, on-main, supply-chain-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install parse-changelog
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: parse-changelog
          fallback: none

      - name: Generate Release Notes
        env:
          CHANGELOG: ${{ needs.release-refs.outputs.changelog }}
          VERSION: ${{ needs.release-refs.outputs.version }}
        run: parse-changelog "$CHANGELOG" "$VERSION" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: ${{ needs.release-refs.outputs.crate }} ${{ needs.release-refs.outputs.version }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lives here rather than in security.yml because it has to *gate* the
  # release. security.yml only triggers on branch pushes and PRs, so the
  # tag-ref condition this job used to carry could never fire — it had
  # never run once. Even with tags added there it would run concurrently
  # with publishing, reporting breakage after the crate was already on
  # crates.io. As a `needs:` of create-release and publish-crates it
  # blocks both, so a bad bump leaves no GitHub Release behind either.
  # Needs only release-refs, not the test matrix, so it runs beside the
  # tests and surfaces a bad bump in a couple of minutes instead of after
  # the full cross-platform run.
  semver-checks:
    name: Semver Compatibility
    needs: [release-refs]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # rustdoc never runs the driver, so skip its download.
    env:
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Both skipped for a crate with no library target (the proc-macro
      # crate), which has no API to compare.
      - name: Install cargo-semver-checks
        if: needs.release-refs.outputs.has-lib == 'true'
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-semver-checks
          fallback: none

      # Compares the just-bumped local version against the last version
      # published to crates.io and fails if the bump is too small for the
      # API change. Only the crate the tag releases is checked.
      - name: Check semver compatibility
        if: needs.release-refs.outputs.has-lib == 'true'
        env:
          CRATE: ${{ needs.release-refs.outputs.crate }}
        run: cargo semver-checks check-release -p "$CRATE"

  publish-crates:
    name: Publish to crates.io
    needs: [release-refs, test, semver-checks, on-main, supply-chain-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only release tags can deploy here, and the crates.io publisher names
    # this environment, so a copy of this file run from a branch can't publish.
    environment: release
    # Scoped to this job, not the workflow: only publishing needs to mint an
    # OIDC token, and `id-token: write` is what lets a job request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # Trusted publishing: exchange a GitHub OIDC token for a crates.io token
      # scoped to this repo, workflow and environment and valid for minutes,
      # instead of holding a long-lived CARGO_REGISTRY_TOKEN that works from
      # anywhere and never expires. The action's post step revokes it when
      # the job ends.
      #
      # This replaces a soft "skip if the secret is missing" guard. That guard
      # would now be actively harmful: with the secret gone it would skip every
      # publish and report success, turning a broken release into a silent
      # no-op. Failing here is the correct behavior — it means the trusted
      # publisher is not configured for the crate being released.
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1

      # One crate per tag; a coordinated release pushes its tags in
      # dependency order (the release-process skill has the sequence).
      - name: Publish ${{ needs.release-refs.outputs.crate }}
        run: cargo publish -p "$CRATE"
        env:
          CRATE: ${{ needs.release-refs.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
