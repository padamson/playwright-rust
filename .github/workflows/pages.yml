name: Pages

# Versioned deploy of the Leptos landing page to the `gh-pages` branch:
#   - push to main            -> rebuilds /dev/   (unreleased preview)
#   - workflow_dispatch+input -> builds /v<version>/ from CURRENT source
#                                (bootstrap of /v0.14.0/, and each release: a
#                                release runs `gh workflow run pages.yml -f
#                                version=X.Y.Z` from the tag — see release docs)
#   - pull request            -> builds and gates only, no deploy
# Each run regenerates /versions.json (the dropdown manifest) + the root
# redirect to the latest release. Deploys only if the playwright-rs dogfood
# test passes against the built output. The site crates are excluded from the
# root workspace, so this is the only workflow that builds/tests them, and
# the pull-request trigger is what makes it a check. Dependabot bumps these
# crates' lockfiles and its PRs auto-merge once main's required checks pass,
# and a merge made with the GitHub token triggers no workflow, so without
# this a site-breaking bump merges itself and nothing runs here until the
# next human push touches the site. The first such bump (gloo-net 0.7 moving
# Response::json behind a feature) was held back only because cargo vet
# failed on the same PR. This job is in the ruleset's required checks, which
# is why the pull-request trigger has no paths filter: a required check that
# never reports leaves a PR waiting forever, so every PR runs it.
#
# One-time setup after the first run: Settings -> Pages -> Build and deployment
# -> Source: "Deploy from a branch" -> Branch: gh-pages / (root).

on:
  push:
    branches: [main]
    paths:
      - "crates/site/**"
      - "crates/site-e2e/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish current source as /v<version>/ (e.g. 0.14.0). Blank = normal /dev/ build."
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time; don't cancel an in-progress deploy. Pull-request
# runs deploy nothing, so they get their own group and never queue behind
# a deploy or hold one up.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build, dogfood-gate, and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages (read-only on a pull request, which deploys nothing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Determine target snapshot
        id: target
        run: |
          ver="${{ github.event.inputs.version }}"
          if [ -n "$ver" ]; then
            # Guard the snapshot dir name and manifest sort: the input must be a
            # bare MAJOR.MINOR.PATCH. A 'v' prefix (natural, since tags are
            # v-prefixed) would otherwise publish /vv<ver>/ and skew the
            # latest-release computation in update-manifest.sh.
            if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input must be a bare semver like 0.15.0 (no 'v' prefix), got: '$ver'"
              exit 1
            fi
            echo "site_version=$ver" >> "$GITHUB_OUTPUT"
            echo "dest=v$ver" >> "$GITHUB_OUTPUT"
          else
            echo "site_version=dev" >> "$GITHUB_OUTPUT"
            echo "dest=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            crates/site
            crates/site-e2e

      - name: Install Trunk
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: trunk

      # The driver is assembled by build.rs into the user cache beside the
      # browsers, so one cache entry holds both.
      - name: Cache Playwright driver and browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-rust
          key: ${{ runner.os }}-playwright-browsers-1.63.0-v3
          restore-keys: ${{ runner.os }}-playwright-browsers-1.63.0-

      - name: Format + lint site crates
        run: |
          cargo fmt --manifest-path crates/site/Cargo.toml -- --check
          cargo fmt --manifest-path crates/site-e2e/Cargo.toml -- --check
          cargo clippy --manifest-path crates/site/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo clippy --manifest-path crates/site-e2e/Cargo.toml --all-targets -- -D warnings

      # Host-target unit tests for the site crate (the switcher's version/banner
      # logic and the versions.json producer/consumer contract). The crate is
      # outside the root workspace, so `cargo nextest run --workspace` in test.yml
      # never reaches these.
      - name: Test site crate
        run: cargo test --manifest-path crates/site/Cargo.toml

      # Dogfood gate: a canonical root-served dev build the binding can drive.
      # SITE_VERSION=dev so the switcher's dev-banner assertion holds; public-url
      # stays "/" so the e2e server (serving dist at root) resolves assets.
      - name: Build site for dogfood gate
        run: cd crates/site && SITE_VERSION=dev trunk build --release

      - name: Quiesce host package manager (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: ./scripts/quiesce-apt.sh

      - name: Install Chromium
        # Bounded: a contended apt blocks rather than failing (see quiesce-apt.sh).
        timeout-minutes: 15
        run: cargo run --release -p playwright-rs --bin playwright-rs --features cli -- install chromium --with-deps

      - name: Dogfood test (deploy gate)
        run: cargo test --manifest-path crates/site-e2e/Cargo.toml

      # Build the actual snapshot for the target subpath. Assets resolve under
      # /<dest>/; SITE_VERSION labels the build for the switcher + banner.
      - name: Build snapshot for ${{ steps.target.outputs.dest }}
        run: |
          cd crates/site
          SITE_VERSION="${{ steps.target.outputs.site_version }}" \
            trunk build --release --public-url "/${{ steps.target.outputs.dest }}/" --dist dist-snapshot
          rm -rf dist-snapshot/receipts
          cp -r public/receipts dist-snapshot/receipts

      # Gate the artifact that actually ships. The dogfood test above drives the
      # root-served SITE_VERSION=dev build, so it cannot see sub-path asset
      # breakage (shipped once, 46f12fa) or release-only rendering (shipped
      # again in 0.15.0: a stale driver badge and install pin). This serves
      # dist-snapshot under its real base path and asserts both.
      - name: Snapshot smoke test (deploy gate)
        env:
          SNAPSHOT_DIST: ${{ github.workspace }}/crates/site/dist-snapshot
          SNAPSHOT_BASE: /${{ steps.target.outputs.dest }}/
          SNAPSHOT_VERSION: ${{ steps.target.outputs.site_version }}
        run: cargo test --manifest-path crates/site-e2e/Cargo.toml deployed_snapshot_is_sound

      - name: Check out gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            # -B puts the worktree on a local gh-pages branch (not detached HEAD)
            # reset to the remote, so the commit/push below has a ref to push.
            git worktree add -B gh-pages gh origin/gh-pages
          else
            # First run: create the branch off HEAD, then clear inherited files
            # so gh-pages holds only deployed site content.
            git worktree add -b gh-pages gh
            (cd gh && git rm -rqf . >/dev/null 2>&1 || true)
          fi

      - name: Assemble snapshot + manifest
        if: github.event_name != 'pull_request'
        run: |
          dest="${{ steps.target.outputs.dest }}"
          rm -rf "gh/$dest"
          mkdir -p "gh/$dest"
          cp -r crates/site/dist-snapshot/. "gh/$dest/"
          bash crates/site/deploy/update-manifest.sh gh
          echo "playwright-rust.dev" > gh/CNAME
          touch gh/.nojekyll

      - name: Commit + push gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd gh
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Deploy ${{ steps.target.outputs.dest }} (${{ github.sha }})"
            git push origin HEAD:gh-pages
          fi
